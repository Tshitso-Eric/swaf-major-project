## ── SWAF own domain: ALWAYS redirect to HTTPS (never blocked) ───────
server {
    listen 80;
    server_name swafff.duckdns.org;
    return 301 https://swafff.duckdns.org$request_uri;
}

## ── All other HTTP (IP access, other domains) ─────────────────────
## Managed by SWAF Network Controls via /home/ubuntu/swaf/nginx_http_default.conf
## Normal:  return 301 https://swafff.duckdns.org$request_uri;
## Blocked: return 403;
server {
    listen 80 default_server;
    server_name _;
    include /home/ubuntu/swaf/nginx_http_default.conf;
}

server {
    listen 443 ssl;
    server_name swafff.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/swafff.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swafff.duckdns.org/privkey.pem;

    # ── 403 branded block page (used when HTTPS is blocked) ──────────
    error_page 403 /swaf_block_443.html;
    location = /swaf_block_443.html {
        root /home/ubuntu/swaf/front-end/build;
        internal;
    }

    # ── SWAF Admin API endpoints (always accessible) ──────────────────
    location = /login {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /logs {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── eLoan API routes → WAF proxy → eloan-system-api.onrender.com ─
    location = /test {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /register {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /user-login {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /apply-loan {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /loans {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Root location — managed by SWAF Network Controls ────────────
    # Written to /home/ubuntu/swaf/nginx_root.conf by the backend.
    # Normal:  location / { root .../build; try_files ... }
    # Blocked: location / { return 403; }
    include /home/ubuntu/swaf/nginx_root.conf;
}
