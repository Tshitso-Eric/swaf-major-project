server {
    listen 80;
    server_name swafff.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name swafff.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/swafff.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swafff.duckdns.org/privkey.pem;

    # ── 403 branded block page (used when HTTPS is blocked) ──────────
    error_page 403 /swaf_block_443.html;
    location = /swaf_block_443.html {
        root /home/ubuntu/swaf/front-end/build;
        internal;
    }

    # ── SWAF Admin API endpoints (always accessible) ──────────────────
    location = /login {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /logs {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── eLoan API routes → WAF proxy → eloan-system-api.onrender.com ─
    location = /test {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /register {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /user-login {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /apply-loan {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /loans {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Root: SWAF React Admin Dashboard ─────────────────────────────
    # SWAF backend rewrites this block when admin blocks/unblocks HTTPS.
    # DO NOT EDIT the line below — it is managed programmatically.
    # SWAF_ROOT_LOCATION_START
    location / {
        root  /home/ubuntu/swaf/front-end/build;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
    # SWAF_ROOT_LOCATION_END
}
