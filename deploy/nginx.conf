server {
    listen 80;
    server_name swafff.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name swafff.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/swafff.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swafff.duckdns.org/privkey.pem;

    # ── SWAF Admin API endpoints (bypass WAF proxy) ──────────────────
    location = /login {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /logs {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── SWAF React Admin Dashboard (served at root) ──────────────────
    location / {
        root  /home/ubuntu/swaf/front-end/build;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
