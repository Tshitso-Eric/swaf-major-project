server {
    listen 80;
    server_name swafff.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name swafff.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/swafff.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swafff.duckdns.org/privkey.pem;

    # eLoan API endpoints — proxy to WAF
    location ~ ^/(test|user-login|register|apply-loan|loans)(/|$) {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SWAF dashboard API endpoints — proxy to WAF
    location = /login {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /logs {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SWAF React dashboard — serve static files
    location / {
        root  /home/ubuntu/swaf/front-end/build;
        index index.html;
        try_files $uri /index.html;
    }
}
