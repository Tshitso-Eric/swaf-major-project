server {
    listen 80;
    server_name swafff.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name swafff.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/swafff.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swafff.duckdns.org/privkey.pem;

    # ── HTTPS Block Mode ─────────────────────────────────────────────
    # When /etc/nginx/swaf_https_blocked exists, all non-admin traffic
    # is blocked with 503. Admin paths (/login /api/ /logs /static/)
    # are always exempt so the dashboard stays reachable.
    set $https_blocked 0;
    if (-f /etc/nginx/swaf_https_blocked) {
        set $https_blocked 1;
    }
    # Mark as exempt if path starts with an admin prefix
    set $is_admin 0;
    if ($uri ~ ^/(login|api/|logs|static/|favicon\.ico|manifest\.json|logo)) {
        set $is_admin 1;
    }
    # Block = blocked AND not admin
    set $do_block "${https_blocked}${is_admin}";
    if ($do_block = "10") {
        return 503 '{"error":"HTTPS traffic blocked by SWAF administrator"}';
    }

    # ── SWAF Admin API endpoints ──────────────────────────────────────
    location = /login {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /logs {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── eLoan API routes → WAF proxy → eloan-system-api.onrender.com ─
    location = /test {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /register {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = /user-login {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /apply-loan {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /loans {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SWAF React Admin Dashboard (served at root) ──────────────────
    location / {
        root  /home/ubuntu/swaf/front-end/build;
        try_files $uri $uri/ /index.html;
        index index.html;
    }
}
